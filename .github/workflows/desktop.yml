# 桌面程序「初星助手」（app/）的安装包：Windows 安装程序在 Ubuntu 上交叉编译（mygo 不用 cgo，NSIS 用 apt 的 makensis），
# macOS 通用版磁盘镜像在 macOS runner 上打（dmg 要 macOS）。安装包由这里的 CI 从源码构建，
# 安装包目前没有代码签名；以后拿到证书也只签这里产出的文件（见 docs/code-signing-policy.md）。
# 推 desktop-v* 标签时把安装包和 SHA256SUMS.txt 传到同名 Release；手动触发只留 Actions 产物。
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: windows/amd64
            uv: windows-amd64
            out: build/windows-amd64/*-setup-*.exe
            name: windows-amd64
          - os: macos-latest
            platform: darwin/universal
            uv: "darwin-arm64 darwin-amd64"
            out: build/darwin-universal/*.dmg
            name: darwin-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - name: NSIS（Windows 安装程序）
        if: matrix.platform == 'windows/amd64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - run: bun install --frozen-lockfile
      - name: 随安装包带的 uv
        run: bun scripts/fetch-uv.mjs ${{ matrix.uv }}
      - name: 构建
        run: bun run build -- -platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: app/${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "初星助手 ${TAG#desktop-v}（桌面程序）" --notes "见 docs/code-signing-policy.md 和 README 的「桌面程序」一节。"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *
