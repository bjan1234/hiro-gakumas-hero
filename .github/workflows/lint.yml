name: lint
on:
  push:
  pull_request:

# 默认只读。actions 都钉到提交 SHA（注释里是对应版本），由 Dependabot 提升级 PR
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "ruff==0.17.6"
      - name: 代码检查
        run: ruff check --output-format=github .
      - name: 格式
        run: ruff format --check .
  typecheck:
    # 只拦新增的类型错误：现有的记在 .basedpyright/baseline.json。基线是在这个环境（Python 3.10、只装 .[dev]）里生成的
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: basedpyright
